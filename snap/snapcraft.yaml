name: libinput
version: "24.04"
base: core24
summary: libinput-tools helpful in debugging libinput
description: |
  - list-devices:
  List all devices with their default configuration options

  - debug-events:
  Print events to stdout

  - debug-gui:
  Display a simple GUI to visualize libinput's events.

  - measure <feature>:
  Measure various device properties. See the man page for more info

  - analyze <feature>:
  Analyze device events. See the man page for more info

  - record:
  Record event stream from a device node. See the man page for more info

  - replay:
  Replay a previously recorded event stream. See the man page for more info

  - calibrate-touchscreen:
  Bonus utility to help with touchscreen calibration.
  https://mir-server.io/docs/howto-calibrate-a-touchscreen-device

title: libinput
website:     https://github.com/AlanGriffiths/libinput
source-code: https://github.com/AlanGriffiths/libinput
issues:  https://github.com/AlanGriffiths/libinput/issues
contact: https://github.com/AlanGriffiths/libinput/issues
license: Apache-2.0

grade: stable
confinement: strict

platforms:
  amd64:
  armhf:
  arm64:
  ppc64el:

layout:
  /usr/share/drirc.d:
    bind: $SNAP/graphics/drirc.d
  /usr/share/X11/xkb:
    bind: $SNAP/usr/share/X11/xkb
  /usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/gdk-pixbuf-2.0:
    bind: $SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/gdk-pixbuf-2.0
  /usr/share/mime:
    bind: $SNAP/usr/share/mime
  /etc/gtk-3.0:
    bind: $SNAP/etc/gtk-3.0
  /usr/libexec/libinput:
    symlink: $SNAP/usr/libexec/libinput
  /usr/share/libinput:
    symlink: $SNAP/usr/share/libinput

plugs:
  gpu-2404:
    interface: content
    target: $SNAP/gpu-2404
    default-provider: mesa-2404

apps:
  list-devices:
    plugs:
      - raw-input
    command: usr/bin/libinput list-devices

  debug-events:
    plugs:
      - raw-input
    command: usr/bin/libinput debug-events

  debug-gui:
    plugs:
      - opengl
      - raw-input
      - wayland
    command-chain:
      - bin/gpu-2404-wrapper
      - bin/wayland-launch
    command: usr/bin/libinput debug-gui

  measure:
    plugs:
      - raw-input
    command: usr/bin/libinput measure

  analyze:
    plugs:
      - raw-input
    command: usr/bin/libinput analyze

  record:
    plugs:
      - raw-input
    command: usr/bin/libinput record

  replay:
    plugs:
      - raw-input
    command: usr/bin/libinput replay

  calibrate-touchscreen:
    plugs:
      - wayland
    command-chain:
      - bin/gpu-2404-wrapper
      - bin/wayland-launch
    command: bin/calibrate-touchscreen

parts:
  scripts:
    plugin: dump
    source: scripts
    stage-packages:
      - inotify-tools

  libinput-tools:
    plugin: nil
    stage-packages:
      - libinput-tools

  calibrate-touchscreen:
    plugin: rust
    source: calibrate-touchscreen

  gtkstuff:
    plugin: nil
    build-packages:
      - libgdk-pixbuf2.0-0
      - librsvg2-common
      - shared-mime-info
    override-build: |
      # Update mime database
      update-mime-database ${CRAFT_PART_INSTALL}/usr/share/mime
    stage-packages:
      - librsvg2-common
      - gsettings-desktop-schemas
      - libglib2.0-bin
    override-prime: |
      craftctl default
      # Compile the gsettings schemas
      /usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/glib-2.0/glib-compile-schemas "$CRAFT_PRIME/usr/share/glib-2.0/schemas"
      # Index the pixbuf loaders
      LOADERS_PATH=$(echo ${CRAFT_PRIME}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/gdk-pixbuf-2.0/*/loaders)
      QUERY_LOADERS=/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders
      GDK_PIXBUF_MODULEDIR=${LOADERS_PATH} ${QUERY_LOADERS} > ${LOADERS_PATH}/../loaders.cache
      sed s!$CRAFT_PRIME!!g --in-place ${LOADERS_PATH}/../loaders.cache

  gpu-2404:
    after:
      - scripts
      - libinput-tools
      - gtkstuff
      - calibrate-touchscreen
    source: https://github.com/canonical/gpu-snap.git
    plugin: dump
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2404-cleanup mesa-2404 nvidia-2404
    prime:
      - bin/gpu-2404-wrapper